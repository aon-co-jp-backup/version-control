[package]
name = "version-control"
version = "0.1.0"
edition = "2021"
description = "Checks every repository under a root for outdated dependencies / stale clones and tells you (e-mail + LINE) what to run in Claude when the automatic maintainers cannot cope."
license = "MIT"
repository = "https://github.com/aon-co-jp/version-control"

[lints.rust]
unsafe_code = "deny"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
rust-json = { path = "../RS-JSON" }
