name_en = "Health checks"
standard = "gRPC Health Checking Protocol (grpc.health.v1)"
standard_urls = ["https://github.com/grpc/grpc/blob/master/doc/health-checking.md"]
replaceability = "replaceable"
replacement = "サービス間は grpc.health.v1.Health/Check に置き換え可能(RPoem の open-runo-gateway は実装済み)。ブラウザ・curl 用は Connect の POST /grpc.health.v1.Health/Check(JSON)にできる。素の GET /healthz を呼ぶ外部の監視・systemd・version-control の稼働判定は、呼び出し側を移すまで残る。"
next_step = "呼び出し側(version-control の maintainers.health_url、監視)を Connect POST へ移したうえで、各 /healthz を消す。新規の /healthz は足さない。"
search_queries = ["grpc.health.v1 Connect protocol health check JSON POST", "connectrpc grpc health check HTTP probe kubernetes"]
