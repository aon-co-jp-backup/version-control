[[exception]]
id = "otlp"
name = "OTLP(テレメトリの送信)"
name_en = "OTLP (telemetry export)"
standard = "OpenTelemetry Protocol (OTLP/gRPC 4317, OTLP/HTTP 4318)"
standard_urls = ["https://opentelemetry.io/docs/specs/otlp/"]
replaceability = "replaceable"
replacement = "OTLP には gRPC 版がある。現在は opentelemetry-otlp を http-proto 特性で使っているため、grpc-tonic 特性へ切り替えれば HTTP の送信は不要になる(受け側コレクターは 4317)。"
next_step = "RPoem と open-web-server の opentelemetry-otlp を grpc-tonic に切り替えて(tonic の依存増とビルド時間を確認)、HTTP/4318 を使わない。"
search_queries = ["opentelemetry-otlp grpc-tonic rust feature", "OTLP gRPC vs HTTP exporter recommendation"]
signal_terms = ["grpc-tonic", "otlp/grpc", "4317", "default grpc"]
[[exception.use]]
repo = "RPoem"
where = "Cargo.toml:72(opentelemetry-otlp 0.33、features = http-proto, reqwest-client, trace)。crates/open-runo-core/src/lib.rs:100 に OTLP HTTP endpoint の設定"
[[exception.use]]
repo = "open-web-server"
where = "Cargo.toml:73(opentelemetry-otlp 0.32、features = http-proto, reqwest-blocking-client)"

