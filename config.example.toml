# Copy to config.toml (git-ignored). Secrets are passed as paths to txt files, never written here.

# Folder that holds all the repository clones (one level down).
root = "F:/"
# Repositories to skip (folder names).
# Repositories whose names must not appear on the public dashboard.
private = ["aruaru-db-archive", "realdata.pro"]
site_dir = "site"
exclude = ["_anon", "_gen", "tmp", "var", "open-media-test", "make-disk-target-alt", "make-disk-target-rel"]

# Maintainers that normally keep things current. If none of them answers, every
# non-trivial finding is escalated to Claude.
# Each maintainer is probed with a GET on health_url; an empty url counts as "not running".
[[maintainers]]
name = "aruaru-llm"
health_url = "http://127.0.0.1:4600/aruaru_llm.v1.Llm/Accelerators"   # Connect: POST {}
[[maintainers]]
name = "open-cuda"
health_url = ""
[[maintainers]]
name = "open-cpu"
health_url = ""
[[maintainers]]
name = "open-directx"
health_url = ""

[policy]
# Patch/minor bumps of >=1.0 dependencies are left to the maintainers;
# majors, 0.x minors, stale clones and scan errors are escalated to Claude.
fetch_clones = true          # run `git fetch` per clone to see whether it is behind origin
registry_cache_hours = 20
max_items_per_message = 12   # one message per repository, this many lines at most

[notify]
# E-mail: same SMTP environment variables as open-easy-web
#   OPEN_EASYWEB_SMTP_HOST / PORT / USERNAME / PASSWORD / FROM
email_to = ["you@example.com"]
# LINE Messaging API push (LINE Notify ended on 2025-03-31).
line_token_file = "F:/line-channel-token.txt"   # long-lived channel access token
line_to_file = "F:/line-user-id.txt"            # your LINE user id (starts with U)

[apiex]
# API exception ledger and patrol (exceptions.toml, API-EXCEPTIONS.md). Secrets: none here.
# The admin token for open-easy-web's notice endpoint comes from the environment variable named token_env
# (on the VPS scripts/load-admin-token.sh writes env.api; never print it).
enabled = true
ledger = "exceptions.toml"
search_url = "http://127.0.0.1:4610"   # aruaru-search
llm_url = "http://127.0.0.1:4600"      # aruaru-llm (small model: a reference note only)
llm_timeout_secs = 45
notify_url = "https://easy-web.tokyo"
token_env = "OPEN_EASYWEB_DIST_SYNC_ADMIN_TOKEN"
skip_paths = ["runo/repository"]       # repo/relative/dir the route counter must not enter (nested mirror)

[fix]
# 自動修正 (--fix --apply)。ビルドする機械でだけ true にする(VPS は false のまま)。
enabled = false
allow_push = false     # --push: 既定ブランチへ直接 push (テスト全通過時のみ)
allow_pr = false       # --pr: 新ブランチ vc/... を push して gh で PR を作る (強制 push はしない)
lock_refresh = []      # Cargo.lock を cargo update で互換更新するリポジトリ名 ("*" で全部)
max_workers = 0        # 同時に検証するリポジトリ数の上限 (0 = コア数とメモリから自動, 最大8)
sync_clones = false    # --sync / --auto: 手元が綺麗で origin より遅れているだけのクローンを fast-forward する (ビルド不要なので VPS でも true にしてよい)
upgrade = false        # --auto: 古い要求(Cargo.toml/package.json)を最新へ上げ、1つずつビルド確認→全体テスト→ vc/upgrade-日付 ブランチ+PR にする
upgrade_skip = []      # 自動では上げない依存名 (人が判断する major など)
upgrade_max = 12       # 1リポジトリ・1回で上げる依存数の上限
upgrade_max_repos = 5   # 1回の実行で新しい PR を作るリポジトリ数の上限 (残りは翌日)

[review]
# --review (--auto に含まれる): 開いている vc/upgrade-* PR の点検。auto_merge = true なら、全変更が宣言した範囲内(メジャーなし)・マージ可能・
# CI失敗なし・テスト合格の PR だけ squash マージ。メジャーは絶対にマージしない。
auto_merge = false
owner = "aon-co-jp"

[selfupdate]
# version-control 自身の自己更新 (--self-update、enabled なら毎回の実行の最初)。クリーンで遅れているだけのクローンだけ fast-forward →
# ビルド → 起動確認 (--version) に成功したときだけ置き換え、失敗したら元のコミットに戻す。成功したら新しい build で同じ引数を再実行。
enabled = false
dir = "."                                       # このプログラムのクローン
build_command = ["cargo", "build", "--release", "--locked"]
binary = "target/release/version-control"       # Windows は .exe

[autoloop]
# `version-control --loop --only REPO [--goal "..."] [--push]`: Claude Code Desktop-style repeat cycle
# (investigate -> confirm -> develop -> improve -> test -> debug) run in a fresh clone. Off by default;
# enable only on a machine that may build and run the agent (never the production VPS).
enabled = false
max_cycles = 4
agent_command = ["claude", "-p", "--permission-mode", "acceptEdits"]   # prompt on stdin
# test_command = ["cargo", "test", "--no-fail-fast"]   # empty = guess from Cargo.toml / package.json / pytest
work_dir = ".vc-loop"
allow_push = false   # --push is ignored unless true
